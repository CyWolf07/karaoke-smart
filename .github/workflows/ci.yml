name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: karaoke
          POSTGRES_PASSWORD: karaoke
          POSTGRES_DB: karaoke_test
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U karaoke" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://karaoke:karaoke@localhost:5434/karaoke_test
      REDIS_URL: redis://localhost:6380
      JWT_ACCESS_SECRET: ci_secret_ci_secret_ci_secret_ci_secret_ci_secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm --filter @ks/api prisma:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build --filter=!@ks/mobile

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t karaoke-smart-api .
      - run: docker build -f apps/worker/Dockerfile -t karaoke-smart-worker .
